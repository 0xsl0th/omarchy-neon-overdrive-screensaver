[general]
bars = 18
framerate = 24
autosens = 1
sensitivity = 100
sleep_timer = 0
lower_cutoff_freq = 45
higher_cutoff_freq = 16000

[input]
method = pipewire
source = auto
active = 1
remix = 1
virtual = 1

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 1
noise_reduction = 65
